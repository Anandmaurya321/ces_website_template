version: "3.9"

services:
  backend:
    # build: ./backend
    
    image: anandm2004/college_organization_temp_backend:latest

    container_name: homehelp-backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env.production
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    
    #build: ./frontend

    image: anandm2004/college_organization_temp_frontend:latest

    container_name: homehelp-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped  

  mongo:
    image: mongo:7
    container_name: homehelp-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
